[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-secrets-dr"
version = "0.1.0"
description = "Disaster recovery for Databricks workspace secrets (scopes, values, ACLs) — KMS envelope encryption + S3 cross-region replication."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Ankita Darekar" }]
dependencies = [
    "databricks-sdk>=0.30",
    "PyYAML>=6.0",
    "boto3>=1.28",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
# python -m databricks_dr.modules.secrets.runner export | import
databricks-secrets-dr = "databricks_dr.modules.secrets.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
