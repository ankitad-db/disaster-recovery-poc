[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-dr"
version = "0.1.0"
description = "Disaster Recovery framework for unsupported Databricks resources. First module: Unity Catalog models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Ankita Darekar" }]
dependencies = [
    "mlflow>=2.16",
    "databricks-sdk>=0.30",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
# Seeding the POC model trains a small sklearn model (present on ML runtimes).
seed = [
    "scikit-learn>=1.3",
]
# Workspace-secrets DR module: S3 bundle store + KMS envelope encryption.
secrets = [
    "boto3>=1.28",
    "cryptography>=41",
]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
databricks-dr = "databricks_dr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
