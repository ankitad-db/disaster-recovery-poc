# Databricks Asset Bundle — Workspace Secrets DR.
#
# Direct cross-workspace replication: a scheduled REPLICATE job runs in the ACTIVE
# (primary/east) workspace and pushes the delta into the secondary. Hosts match
# config/secrets_dr_config.yaml.
#
#   databricks bundle validate -t east
#   databricks bundle deploy   -t east        # primary (us-east-2): scheduled replicate
#
# Go live (unpause the schedule) once a manual run has been verified:
#   databricks bundle deploy -t east --var replicate_pause_status=UNPAUSED
#
# Run on demand:
#   databricks bundle run dr_secrets_replicate -t east
#
# On failover, run in the promoted workspace with direction=failback.
# Each target maps to a CLI profile from `databricks auth login ... --profile`.

bundle:
  name: databricks-secrets-dr

include:
  - resources/*.yml

sync:
  include:
    - src/**
    - config/**
    - notebooks/**
    - sql/**
    - pyproject.toml
    - requirements.txt

variables:
  replicate_schedule_cron:
    description: Quartz cron for the scheduled replicate in the primary. Tune to your RPO.
    default: "0 0/15 * * * ?"   # every 15 minutes
  replicate_pause_status:
    description: PAUSED|UNPAUSED for the replicate schedule. Set UNPAUSED to go live.
    default: "PAUSED"
  alert_email:
    description: Address for job-failure notifications.
    default: ankita.darekar@databricks.com

# Primary (east) is the default day-to-day target: it runs the scheduled replicate.
# On failover, deploy/run in the promoted workspace with direction=failback.
targets:
  east:
    default: true
    mode: development
    workspace:
      profile: dr-east
      host: https://fe-sandbox-fe-sandbox-ps-dr-wp-us-east-2.cloud.databricks.com

  west:
    mode: development
    workspace:
      profile: dr-west
      host: https://fe-sandbox-fe-sandbox-ps-dr-wp-us-west-2.cloud.databricks.com
