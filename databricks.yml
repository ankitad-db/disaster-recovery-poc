# Databricks Asset Bundle for the DR framework.
# Deploys the repo + scheduled DR workflows to a target workspace.
#
#   databricks bundle validate -t west
#   databricks bundle deploy   -t west       # primary (us-west-2)
#   databricks bundle deploy   -t east       # secondary (us-east-1), for failback
#   databricks bundle run dr_models_cdc -t west
#
# Each target maps to a CLI profile from `databricks auth login ... --profile`.

bundle:
  name: databricks-dr

include:
  - resources/*.yml

# Synced to the workspace under /Workspace/Users/<me>/.bundle/... by default.
sync:
  include:
    - src/**
    - config/**
    - notebooks/**
    - sql/**
    - pyproject.toml
    - requirements.txt

variables:
  cdc_schedule_cron:
    description: Quartz cron for the incremental CDC job.
    default: "0 0/15 * * * ?"   # every 15 minutes
  warehouse_id:
    description: SQL warehouse id used for audit-table writes (optional).
    default: ""

targets:
  west:
    default: true
    mode: development
    workspace:
      profile: dr-west
      host: https://fe-sandbox-ps-dr-wp-us-west-2.cloud.databricks.com
    variables:
      # In a real failover you would point this target's jobs at the active primary.
      cdc_schedule_cron: "0 0/15 * * * ?"

  east:
    mode: development
    workspace:
      profile: dr-east
      host: https://fe-sandbox-ps-dr-wp-us-east-1.cloud.databricks.com
