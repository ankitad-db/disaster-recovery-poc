# Databricks Asset Bundle for the DR framework.
# Deploys the repo + scheduled DR workflows to a target workspace.
#
# Current topology (config/dr_config.yaml): primary = east (fevm-ps, us-east-2),
# secondary = west (krish, us-west-2). Steady-state jobs run in the SECONDARY (they
# pull from the primary), so `west` is the day-to-day deploy/run target; `east` is failback.
#
#   databricks bundle validate -t west
#   databricks bundle deploy   -t west       # secondary (us-west-2): steady-state DR jobs
#   databricks bundle deploy   -t east       # primary  (us-east-2): for failback jobs
#
# Go live (unpause schedules):
#   databricks bundle deploy -t west --var cdc_pause_status=UNPAUSED
# Run a job on demand:
#   databricks bundle run dr_models_replicate -t west     # baseline (in secondary)
#   databricks bundle run dr_models_cdc -t west           # one CDC+health pass
#   databricks bundle run dr_models_failover -t west -- --action failover
#
# Each target maps to a CLI profile from `databricks auth login ... --profile`.

bundle:
  name: databricks-dr

include:
  - resources/*.yml

# Synced to the workspace under /Workspace/Users/<me>/.bundle/... by default.
sync:
  include:
    - src/**
    - config/**
    - notebooks/**
    - sql/**
    - pyproject.toml
    - requirements.txt

variables:
  cdc_schedule_cron:
    description: Quartz cron for the incremental CDC job.
    default: "0 0/15 * * * ?"   # every 15 minutes
  health_schedule_cron:
    description: Quartz cron for the independent health-scan safety-net job.
    default: "0 0 * * * ?"      # hourly
  cdc_pause_status:
    description: PAUSED|UNPAUSED for scheduled jobs. Override to UNPAUSED to go live.
    default: "PAUSED"
  alert_email:
    description: Address for job failure / failover notifications.
    default: ankita.darekar@databricks.com
  warehouse_id:
    description: SQL warehouse id used for audit-table writes (optional).
    default: ""

# The steady-state DR jobs live in the SECONDARY (they pull from the primary). With
# the current topology that is `west`, so it is the default day-to-day target;
# `east` (home primary) is the failback target. Hosts match config/dr_config.yaml.
targets:
  west:
    default: true
    mode: development
    workspace:
      profile: dr-west
      host: https://fevm-krish-dr-fevm-us-west-2.cloud.databricks.com

  east:
    mode: development
    workspace:
      profile: dr-east
      host: https://fevm-fevm-ps-dr-us-east-2.cloud.databricks.com
