# Databricks Asset Bundle — Workspace Secrets DR.
#
# Deploys the code + jobs to a target workspace. Steady-state EXPORT runs in the
# PRIMARY (east); the on-failover IMPORT runs in the PROMOTED workspace (west).
# Hosts match config/secrets_dr_config.yaml.
#
#   databricks bundle validate -t east
#   databricks bundle deploy   -t east        # primary (us-east-2): scheduled export
#   databricks bundle deploy   -t west        # secondary (us-west-2): failover import job
#
# Go live (unpause the export schedule) once a baseline export has been verified:
#   databricks bundle deploy -t east --var export_pause_status=UNPAUSED
#
# Run on demand:
#   databricks bundle run dr_secrets_export           -t east
#   databricks bundle run dr_secrets_failover_import  -t west
#
# Each target maps to a CLI profile from `databricks auth login ... --profile`.

bundle:
  name: databricks-secrets-dr

include:
  - resources/*.yml

sync:
  include:
    - src/**
    - config/**
    - notebooks/**
    - sql/**
    - pyproject.toml
    - requirements.txt

variables:
  export_schedule_cron:
    description: Quartz cron for the scheduled export in the primary. Tune to your RPO.
    default: "0 0/15 * * * ?"   # every 15 minutes
  export_pause_status:
    description: PAUSED|UNPAUSED for the export schedule. Set UNPAUSED to go live.
    default: "PAUSED"
  alert_email:
    description: Address for job-failure notifications.
    default: ankita.darekar@databricks.com

# Primary (east) is the default day-to-day target: it runs the scheduled export.
# Secondary (west) hosts the failover import job (triggered on promotion).
targets:
  east:
    default: true
    mode: development
    workspace:
      profile: dr-east
      host: https://fe-sandbox-fe-sandbox-ps-dr-wp-us-east-2.cloud.databricks.com

  west:
    mode: development
    workspace:
      profile: dr-west
      host: https://fe-sandbox-fe-sandbox-ps-dr-wp-us-west-2.cloud.databricks.com
