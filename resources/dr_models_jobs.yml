# DR jobs for the models module — the orchestration layer.
#
#  Steady state (deploy + run in the SECONDARY / us-west-2):
#    dr_models_replicate : one-off baseline full export/import (manual).
#    dr_models_cdc       : scheduled incremental sync THEN health check (the engine).
#    dr_models_health    : independent scheduled drift/failure scan (safety net).
#    dr_models_failover  : manual failover / failback (parameterised).
#
#  Alternative storage-bridge variant (primary exports, S3 CRR bridges, secondary
#  imports): dr_models_export + dr_models_import.
#
# All jobs run as the DR service principal (ad-dr-spn) so replication uses the
# account-admin identity present in both workspaces. Failure (and CDC success)
# notifications go to ${var.alert_email}. Pause/cron/email are bundle variables
# (see databricks.yml) so steady state is flipped on with a single deploy.

resources:
  jobs:
    # BOOTSTRAP: create the UC control tables (catalog/schemas, audit, dr_state) in
    # the LOCAL metastore. Run once per region (deploy + run -t east AND -t west).
    # Idempotent (CREATE ... IF NOT EXISTS), so safe to re-run.
    dr_models_bootstrap:
      name: "[DR] models · bootstrap UC control tables (run once per region)"
      tags: { dr_module: models, dr_phase: bootstrap }
      run_as:
        service_principal_name: ad-dr-spn
      email_notifications:
        on_failure: ["${var.alert_email}"]
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
      queue:
        enabled: true

    # RECOMMENDED baseline: single-job cross-workspace pull. Run once on the
    # SECONDARY (west) to seed it from the primary (east) registry via the dr_remote_east scope.
    dr_models_replicate:
      name: "[DR] models · replicate baseline (run in SECONDARY, pulls from primary)"
      tags: { dr_module: models, dr_phase: baseline }
      run_as:
        service_principal_name: ad-dr-spn
      email_notifications:
        on_failure: ["${var.alert_email}"]
      tasks:
        - task_key: replicate
          notebook_task:
            notebook_path: ../notebooks/02_replicate_secondary.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - -e ..
      max_concurrent_runs: 1
      queue:
        enabled: true

    # STEADY-STATE ENGINE: incremental CDC, then a health check that fails the run
    # (and notifies) on any drift. Unpause after a clean baseline + manual dry run.
    dr_models_cdc:
      name: "[DR] models · CDC + health (scheduled)"
      tags: { dr_module: models, dr_phase: cdc }
      run_as:
        service_principal_name: ad-dr-spn
      schedule:
        quartz_cron_expression: ${var.cdc_schedule_cron}
        timezone_id: UTC
        pause_status: ${var.cdc_pause_status}
      # NEAR-REAL-TIME (paused for the POC): a Model Update Trigger fires the same
      # CDC entry point within seconds of a UC model version/alias change on the
      # PRIMARY, instead of waiting for the cron. This is the event-driven analogue
      # of the system.access.audit scan the changefeed already performs. Uncomment
      # and set the in-scope model name(s) to enable; keep the schedule above as the
      # safety-net backstop.
      #   trigger:
      #     pause_status: PAUSED
      #     model:
      #       # Fires when a new READY version is created or an alias is set.
      #       condition: MODEL_VERSION_READY      # | MODEL_ALIAS_SET
      #       min_time_between_triggers_seconds: 300
      #       securable_name: dr_poc.ml.iris_dr_model
      email_notifications:
        on_failure: ["${var.alert_email}"]
      tasks:
        - task_key: cdc
          notebook_task:
            notebook_path: ../notebooks/03_cdc.py
          environment_key: dr_env
        - task_key: health_check
          depends_on:
            - task_key: cdc
          notebook_task:
            notebook_path: ../notebooks/05_health_check.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - -e ..
      max_concurrent_runs: 1
      queue:
        enabled: true

    # SAFETY NET: independent health scan on its own cadence. Catches drift even if
    # a CDC run never fired (e.g. cluster/quota outage), since it checks the audit
    # table watermark + dest registry directly.
    dr_models_health:
      name: "[DR] models · health scan (scheduled)"
      tags: { dr_module: models, dr_phase: health }
      run_as:
        service_principal_name: ad-dr-spn
      schedule:
        quartz_cron_expression: ${var.health_schedule_cron}
        timezone_id: UTC
        pause_status: ${var.cdc_pause_status}
      email_notifications:
        on_failure: ["${var.alert_email}"]
      tasks:
        - task_key: health_check
          notebook_task:
            notebook_path: ../notebooks/05_health_check.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - -e ..
      max_concurrent_runs: 1
      queue:
        enabled: true

    # Manual failover / failback. action=failover (run in WEST/secondary) | failback (run in EAST/home primary).
    dr_models_failover:
      name: "[DR] models · failover / failback (manual)"
      tags: { dr_module: models, dr_phase: failover }
      run_as:
        service_principal_name: ad-dr-spn
      email_notifications:
        on_failure: ["${var.alert_email}"]
        on_success: ["${var.alert_email}"]
      parameters:
        - name: action
          default: failover
      tasks:
        - task_key: failover
          notebook_task:
            notebook_path: ../notebooks/04_failover_failback.py
            base_parameters:
              action: "{{job.parameters.action}}"
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - -e ..

    # DRILL: self-asserting failover/failback test. Two jobs because the drill is
    # inherently two-sided -- failover runs in WEST, failback in EAST. Each raises
    # on failure so a red run = drill failed.
    dr_models_drill_failover:
      name: "[DR] models · DRILL failover (run in WEST)"
      tags: { dr_module: models, dr_phase: drill }
      run_as:
        service_principal_name: ad-dr-spn
      email_notifications:
        on_failure: ["${var.alert_email}"]
      tasks:
        - task_key: drill_failover
          notebook_task:
            notebook_path: ../notebooks/drill_failover.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - scikit-learn
              - -e ..
      queue:
        enabled: true

    dr_models_drill_failback:
      name: "[DR] models · DRILL failback (run in EAST)"
      tags: { dr_module: models, dr_phase: drill }
      run_as:
        service_principal_name: ad-dr-spn
      email_notifications:
        on_failure: ["${var.alert_email}"]
      tasks:
        - task_key: drill_failback
          notebook_task:
            notebook_path: ../notebooks/drill_failback.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - -e ..
      queue:
        enabled: true

    # ALTERNATIVE (storage-bridge variant): export on PRIMARY, bridge bucket
    # (S3 CRR), then import on SECONDARY.
    dr_models_export:
      name: "[DR] models · baseline export (run in PRIMARY)"
      tags: { dr_module: models, dr_phase: export }
      run_as:
        service_principal_name: ad-dr-spn
      email_notifications:
        on_failure: ["${var.alert_email}"]
      tasks:
        - task_key: export
          notebook_task:
            notebook_path: ../notebooks/02a_export_primary.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - -e ..
      queue:
        enabled: true

    dr_models_import:
      name: "[DR] models · baseline import (run in SECONDARY)"
      tags: { dr_module: models, dr_phase: import }
      run_as:
        service_principal_name: ad-dr-spn
      email_notifications:
        on_failure: ["${var.alert_email}"]
      tasks:
        - task_key: import
          notebook_task:
            notebook_path: ../notebooks/02b_import_secondary.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - -e ..
      queue:
        enabled: true
