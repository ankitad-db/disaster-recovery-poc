# DR jobs for the models module.
#  - dr_models_baseline : one-off, manually triggered full export/import.
#  - dr_models_cdc      : scheduled incremental sync (the steady-state DR engine).
#
# Both run as the DR service principal (ad-dr-spn) via run_as so replication uses
# the account-admin identity present in both workspaces.

resources:
  jobs:
    # RECOMMENDED: single-job cross-workspace pull. Deploy + run on the SECONDARY
    # target; it authenticates to the primary via the dr_remote_west secret scope,
    # exports the remote registry into the local bucket, and imports locally.
    dr_models_replicate:
      name: "[DR] models · replicate (run in SECONDARY, pulls from primary)"
      run_as:
        service_principal_name: ad-dr-spn
      tasks:
        - task_key: replicate
          notebook_task:
            notebook_path: ../notebooks/02_replicate_secondary.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - "git+https://github.com/mlflow/mlflow-export-import@master"
              - -e ..
      max_concurrent_runs: 1
      queue:
        enabled: true

    # ALTERNATIVE (storage-bridge variant): export on PRIMARY, bridge bucket
    # (S3 CRR), then import on SECONDARY.
    dr_models_export:
      name: "[DR] models · baseline export (run in PRIMARY)"
      run_as:
        service_principal_name: ad-dr-spn
      tasks:
        - task_key: export
          notebook_task:
            notebook_path: ../notebooks/02a_export_primary.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - "git+https://github.com/mlflow/mlflow-export-import@master"
              - -e ..
      queue:
        enabled: true

    dr_models_import:
      name: "[DR] models · baseline import (run in SECONDARY)"
      run_as:
        service_principal_name: ad-dr-spn
      tasks:
        - task_key: import
          notebook_task:
            notebook_path: ../notebooks/02b_import_secondary.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - "git+https://github.com/mlflow/mlflow-export-import@master"
              - -e ..
      queue:
        enabled: true

    dr_models_cdc:
      name: "[DR] models · incremental CDC"
      run_as:
        service_principal_name: ad-dr-spn
      schedule:
        quartz_cron_expression: ${var.cdc_schedule_cron}
        timezone_id: UTC
        pause_status: PAUSED        # unpause after baseline + a clean dry run
      tasks:
        - task_key: cdc
          notebook_task:
            notebook_path: ../notebooks/03_cdc.py
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - "git+https://github.com/mlflow/mlflow-export-import@master"
              - -e ..
      max_concurrent_runs: 1
      queue:
        enabled: true

    dr_models_failover:
      name: "[DR] models · failover / failback (manual)"
      run_as:
        service_principal_name: ad-dr-spn
      parameters:
        - name: action
          default: failover
      tasks:
        - task_key: failover
          notebook_task:
            notebook_path: ../notebooks/04_failover_failback.py
            base_parameters:
              action: "{{job.parameters.action}}"
          environment_key: dr_env
      environments:
        - environment_key: dr_env
          spec:
            client: "2"
            dependencies:
              - "git+https://github.com/mlflow/mlflow-export-import@master"
              - -e ..
