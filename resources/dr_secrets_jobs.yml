# Workspace Secrets DR — job definitions.
#
# Two jobs, both SDK-only notebook tasks on serverless compute (the notebooks
# %pip-install boto3 + cryptography themselves):
#
#   dr_secrets_export           steady state, runs in the PRIMARY on a schedule.
#                               Detects change, snapshots + envelope-encrypts, writes
#                               the bundle to S3 (CRR mirrors it to the secondary).
#   dr_secrets_failover_import  triggered on failover in the PROMOTED workspace.
#                               Diffs the local bundle against live state, applies
#                               only the delta. No schedule (run on demand).
#
# Deploy the export job to `east` (primary) and the import job to `west` (secondary);
# both definitions land in whichever target you deploy, but you only run the one that
# matches the workspace's role.

resources:
  jobs:
    dr_secrets_export:
      name: "[DR] Secrets — export (primary)"
      tags:
        project: secrets-dr
        role: primary
      email_notifications:
        on_failure:
          - ${var.alert_email}
      schedule:
        quartz_cron_expression: ${var.export_schedule_cron}
        timezone_id: UTC
        pause_status: ${var.export_pause_status}
      tasks:
        - task_key: export
          notebook_task:
            notebook_path: ../notebooks/secrets/10_export_secrets.py
            base_parameters:
              full: "false"

    dr_secrets_failover_import:
      name: "[DR] Secrets — failover import (promoted)"
      tags:
        project: secrets-dr
        role: secondary
      email_notifications:
        on_failure:
          - ${var.alert_email}
      # No schedule: this runs when the workspace is promoted on failover.
      tasks:
        - task_key: import
          notebook_task:
            notebook_path: ../notebooks/secrets/20_import_secrets.py
            base_parameters:
              region: secondary
