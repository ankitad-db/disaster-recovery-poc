# Workspace Secrets DR — job definitions.
#
# Direct cross-workspace replication (no S3/CRR/KMS). A single scheduled job runs in
# the ACTIVE (primary) workspace and pushes the delta into the secondary. Deploy it to
# the primary (`east`). On failover, run it in the promoted workspace with
# direction=failback (secondary -> primary).
#
# The job reaches the peer workspace with a PAT stored in a local secret scope
# (default `dr_peer`/`token`). Serverless notebook task (the notebook %pip-installs its deps).

resources:
  jobs:
    dr_secrets_replicate:
      name: "[DR] Secrets — replicate (active -> passive)"
      tags:
        project: secrets-dr
      email_notifications:
        on_failure:
          - ${var.alert_email}
      schedule:
        quartz_cron_expression: ${var.replicate_schedule_cron}
        timezone_id: UTC
        pause_status: ${var.replicate_pause_status}
      tasks:
        - task_key: replicate
          notebook_task:
            notebook_path: ../notebooks/secrets/10_replicate_secrets.py
            base_parameters:
              direction: forward
              peer_scope: dr_peer
              peer_key: token
