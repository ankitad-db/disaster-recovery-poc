# Databricks DR configuration.
# Two cross-region workspaces in (separate) Databricks accounts.

regions:
  west:
    role: secondary          # primary | secondary (active role; flipped on failover)
    region: us-west-2
    profile: dr-west         # databricks CLI profile / MLflow registry suffix
    registry_uri: databricks-uc://dr-west
    host: https://fevm-krish-dr-fevm-us-west-2.cloud.databricks.com
    metastore: aws:us-west-2:616f89c2-6a5b-4106-9253-2e6f81df10e4
    workspace: fevm-krish-dr-fevm-us-west-2
    # Only used by the optional bridge: sync|crr path; the default pull stages on the
    # staging volume. The 'dr-access-to-us-east' external location (account users have
    # ALL PRIVILEGES) backs both the catalog managed storage (/dr_managed) and the
    # staging volume (/dr_staging) under distinct prefixes -- only one EL is available here.
    dbfs_bucket: vdm-classic-pxl08i-ext-s3-049629455384-bz222e
    # S3 bucket behind this workspace's UC external location (backs the staging volume).
    external_location_url: s3://vdm-classic-pxl08i-ext-s3-049629455384-bz222e/
  east:
    role: primary
    region: us-east-2
    profile: dr-east
    registry_uri: databricks-uc://dr-east
    host: https://fevm-fevm-ps-dr-us-east-2.cloud.databricks.com
    metastore: aws:us-east-2:483f96cd-b7ac-49a4-94d3-9217a3140461
    workspace: fevm-fevm-ps-dr-us-east-2
    # Only used by the optional bridge: sync|crr path; the default pull stages on the
    # staging volume. Points at this region's real external S3 bucket (the FEVM external
    # location we have ALL PRIVILEGES on — dr_poc's own managed bucket is separate).
    dbfs_bucket: fevm-ps-dr-us-east-2-ext-s3-049629455384-vmmrp0
    external_location_url: s3://fevm-ps-dr-us-east-2-ext-s3-049629455384-vmmrp0/

# Identity used for replication (account admin SPN, present in both workspaces).
# Reference by application-id (UC grants/run_as resolve SPNs by app-id, not display name).
service_principal: dc5781bc-c86f-4808-a00c-930062f91f17

# Unity Catalog naming, mirrored in BOTH metastores.
uc:
  catalog: dr_poc
  schema: ml
  control_schema: dr_control          # audit + state tables live here
  audit_table: dr_poc.dr_control.dr_replication_audit
  state_table: dr_poc.dr_control.dr_state   # active-primary role (failover source of truth)
  mapping_table: dr_poc.dr_control.dr_id_mapping  # source<->dest experiment/run/version IDs

# Storage layout for export bundles (folders auto-created on first write).
storage:
  base_path: dr                       # <staging_root>/dr/...
  primary_folder: primary             # primary-authored exports (primary -> secondary)
  secondary_folder: secondary         # secondary-authored exports (failback)
  latest_pointer: _latest.txt
  bridge: sync                        # sync (aws s3 sync) | crr (rely on S3 CRR)
  # Staging root for bundles. Set to a UC external Volume (3-level cat.schema.vol)
  # to stage on a governed, S3-backed location reachable via /Volumes/... — works on
  # serverless + shared compute (unlike the DBFS root /dbfs FUSE). 00_setup creates
  # this volume on the LOCAL region's external_location_url. Comment out to fall back
  # to the DBFS root (/dbfs).
  staging_volume: dr_poc.dr_control.dr_staging

# Replication engine. Only the first-party native MLflow-API engine is supported
# (src/databricks_dr/common/native); the value is kept for forward-compatibility.
engine:
  backend: native

# Cross-workspace replication credentials.
# The DR job runs in the LOCAL (destination) workspace and pulls from the REMOTE
# (source) workspace's registry. Each entry is the secret scope IN THE LOCAL
# workspace that holds host + token (an ad-dr-spn PAT) for reaching that source.
#   Normal sync : runs in east, source = west  -> uses secrets.west  (scope lives in east)
#   Failback    : runs in west, source = east  -> uses secrets.east  (scope lives in west)
secrets:
  west:
    scope: dr_remote_west
    host_key: host
    token_key: token
  east:
    scope: dr_remote_east
    host_key: host
    token_key: token

# Models module scope.
models:
  # Names or prefixes to replicate. Use "all" for everything.
  include:
    - dr_poc.ml.iris_dr_model
    - dr_poc.ml.wine_dr_model
    - dr_poc.ml.cancer_dr_model
  # POC-only seeding spec (used by 01_seed_primary.py). Each entry creates one model
  # with n_versions backing runs. dataset in: iris | wine | breast_cancer.
  # In production this section is ignored (your training pipeline produces the models).
  seed:
    - {name: dr_poc.ml.iris_dr_model,   dataset: iris,          n_versions: 2}
    - {name: dr_poc.ml.wine_dr_model,   dataset: wine,          n_versions: 3}
    - {name: dr_poc.ml.cancer_dr_model, dataset: breast_cancer, n_versions: 2}
  export_all_runs_on_baseline: true
  export_version_model: true
  export_permissions: true
  # Destination experiment parent for imported version runs (avoids notebook-path
  # collisions; per-model child = <base>/<model name with dots->underscores>).
  dest_experiment_base: /Shared/dr/experiments
  # Consumer-facing extras
  replicate_grants: true

  # --- native engine tuning (all optional; safe defaults shown) ---
  # Bounded parallelism for per-version (single model) and per-model (bulk) work.
  # 1 = fully sequential/deterministic (POC default); raise for throughput at scale.
  max_workers: 1
  # Per-model resilience. Each model's export/import is isolated: a failure is
  # retried with exponential backoff on *transient* errors (throttling / 5xx /
  # network), recorded to the audit table (retry_count), and the run continues with
  # the remaining models -- then fails loudly at the end if any model failed, so a
  # single bad model never aborts a whole batch. retry_attempts counts the total
  # tries (1 = no retry); retry_base_delay is the first backoff in seconds (doubles).
  retry_attempts: 3
  retry_base_delay: 2.0
  # Notebook revisions to export with each backing run (CSV or list): SOURCE|HTML|JUPYTER|DBC.
  notebook_formats: SOURCE
  # Optional workspace dir to re-upload SOURCE notebooks into on import (null = skip).
  notebook_dest_dir: null
  # MLflow 3 / GenAI replication (version-gated; degrade to SKIPPED when unsupported).
  prompts: []                 # prompt-registry names to replicate (>=2.21)
  evaluation_datasets: []     # GenAI evaluation dataset names to replicate (>=3.4)
  replicate_traces: false     # traces+assessments can be large; off by default (>=2.14)
  # CDC change detection. Default = authoritative registry diff (correct + idempotent
  # for the cross-account pull). Set true only where the job's system.access.audit
  # stream carries the SOURCE's model events (source-side / shared-account runs).
  cdc_use_system_tables: false
  # Metadata-drift detection. Beyond the version watermark, compute a signature over
  # each source model's aliases/tags/descriptions and compare it to the last synced
  # signature in dr_object_inventory, so metadata-only changes (new/moved alias, tag
  # or description edits) that don't bump a version are still re-synced. Account-
  # agnostic (no dependency on system.access.audit). Set false on very large
  # registries where the extra per-version metadata reads outweigh the benefit.
  detect_metadata_drift: true
