# Workspace Secrets DR — standalone configuration.
#
# Direct cross-workspace replication (no S3, no CRR, no KMS): a `replicate` job runs
# in the ACTIVE workspace, reads the SOURCE secrets, reads the DESTINATION secrets
# cross-workspace via the Secrets API (no compute on the passive side), diffs them,
# and pushes ONLY the delta straight into the destination. Values move over TLS; both
# secret stores are encrypted at rest by the platform. Failover = replicate with the
# roles swapped (the secondary is a warm mirror).

workspaces:
  primary:
    region: us-east-2
    host: https://fe-sandbox-fe-sandbox-ps-dr-wp-us-east-2.cloud.databricks.com
    profile: dr-east                 # ~/.databrickscfg profile for off-cluster/local runs
    workspace_id: "7474657900994867"
  secondary:
    region: us-west-2
    host: https://fe-sandbox-fe-sandbox-ps-dr-wp-us-west-2.cloud.databricks.com
    profile: dr-west
    workspace_id: "7474651252878032"

# Which secret scopes to protect.
scopes:
  include: ["all"]     # "all" = every scope the caller can read; or an explicit list
  exclude: []          # scope names to skip (e.g. transient/dev scopes)

# Replication behaviour (direct diff-and-apply, source -> destination).
#   mode: mirror   -> destination ends up identical to the source (adds, updates, and
#                     deletes secrets/ACLs the source no longer has)
#         additive -> only add/update; never delete on the destination
#   prune_extra_scopes: also drop whole scopes absent from the source (mirror only)
reconcile:
  mode: mirror
  prune_extra_scopes: false

# UC control tables (created by notebooks/secrets/00_setup_secrets.py), one per
# workspace so either side can read its own history/state.
control:
  catalog: dr_poc
  schema: dr_control
  # Per-workspace catalog override (falls back to `catalog`). Some metastores have no
  # managed storage for a fresh `dr_poc` catalog, so a workspace can point at a catalog
  # that already has managed storage (e.g. its default catalog). Table names are fixed:
  #   <catalog>.<schema>.dr_secrets_{audit,inventory}
  catalog_by_workspace:
    secondary: fe_sandbox_ps_dr_wp_us_west_2_catalog   # west default catalog (has managed storage)
  # Optional SQL warehouse id for off-cluster (local) control-table writes.
  warehouse_id: ""

# Identity the DR jobs run as (account-admin SPN present in both workspaces).
# Needs READ on the in-scope secret scopes (to call get-secret) on the primary,
# and MANAGE (put_secret/put_acl) on the secondary at failover.
service_principal: dc5781bc-c86f-4808-a00c-930062f91f17

# POC-only seeding (used by notebooks/secrets/01_seed_secrets.py). Creates sample
# secret scopes + keys + ACLs in the PRIMARY so the export has something to protect.
# Only key NAMES and ACLs are listed here -- the VALUES are generated randomly at
# runtime and never stored in git. In production this section is ignored (your real
# scopes already exist). Remove/empty it once you point `scopes.include` at real scopes.
seed:
  scopes:
    - name: dr_app_prod
      keys: [db_password, api_token, service_url]
      acls:
        # 'current_user' is resolved to the running identity at seed time (always
        # exists). Replace with a real group/SPN/email to model production ACLs.
        - {principal: current_user, permission: MANAGE}
    - name: dr_app_analytics
      keys: [warehouse_token, s3_access_key]
      acls: []
