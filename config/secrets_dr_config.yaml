# Workspace Secrets DR — standalone configuration.
#
# This is intentionally independent of the models DR config (dr_config.yaml):
# workspace secrets are a different asset with a different mechanism (no MLflow,
# no UC registry). The strategy here is:
#
#   * EXPORT runs in the PRIMARY workspace (compute + READ available there), reads
#     secret VALUES with the new get-secret API, and writes an envelope-encrypted
#     bundle to the primary-region S3 bucket.
#   * S3 Cross-Region Replication (bidirectional) carries the bundle to the other
#     region's bucket. No compute is needed in the secondary before failover.
#   * IMPORT runs in the PROMOTED workspace on failover: read the bundle from the
#     LOCAL-region bucket, decrypt, and re-create scopes/secrets/ACLs.
#
# Incremental change detection is system-tables-first (native): scan
# system.access.audit for secret mutation events, with a full state-diff recon as
# the safety net.

workspaces:
  primary:
    region: us-east-2
    host: https://fevm-fevm-ps-dr-us-east-2.cloud.databricks.com
    profile: dr-east                 # ~/.databrickscfg profile for off-cluster/local runs
    workspace_id: "7474660494970929" # used to scope the system.access.audit query
  secondary:
    region: us-west-2
    host: https://fevm-krish-dr-fevm-us-west-2.cloud.databricks.com
    profile: dr-west
    workspace_id: "7474658261824919"

# Which secret scopes to protect.
scopes:
  include: ["all"]     # "all" = every scope the caller can read; or an explicit list
  exclude: []          # scope names to skip (e.g. transient/dev scopes)

# Incremental change detection.
detection:
  # system_tables (native, default) | state_diff (SDK list-* only, no system tables)
  strategy: system_tables
  audit_table: system.access.audit
  service_name: secrets            # system.access.audit service for secret events
  lookback_hours: 48               # bound the audit scan when no watermark exists yet
  # Even with system_tables, periodically diff the full live state against the
  # inventory to catch anything the audit stream missed (latency/retention/gaps).
  full_recon: true

# DR storage: one S3 bucket per region + KMS. Values are envelope-encrypted client
# side (KMS data key + AES-GCM) BEFORE they touch S3, and the bucket is SSE-KMS +
# bidirectionally CRR-replicated. See docs/secrets_dr_aws_ticket.md.
storage:
  primary_bucket:   s3://REPLACE-sec-dr-us-east-2
  secondary_bucket: s3://REPLACE-sec-dr-us-west-2
  prefix: secrets
  latest_pointer: _latest.txt
  # KMS key (id or alias) per region for the envelope data keys.
  kms_key:
    us-east-2: alias/dr-secrets-us-east-2
    us-west-2: alias/dr-secrets-us-west-2
  # Client-side envelope encryption of values (recommended). When false, values
  # still ride SSE-KMS at rest but sit as plaintext inside the bundle object.
  client_side_encryption: true

# UC control tables (created by notebooks/secrets/00_setup_secrets.py), mirrored in
# BOTH workspaces so either side can read its own history/state.
control:
  catalog: dr_poc
  schema: dr_control
  audit_table: dr_poc.dr_control.dr_secrets_audit
  inventory_table: dr_poc.dr_control.dr_secrets_inventory
  # Optional SQL warehouse id for off-cluster (local) control-table writes.
  warehouse_id: ""

# Identity the DR jobs run as (account-admin SPN present in both workspaces).
# Needs READ on the in-scope secret scopes (to call get-secret) on the primary,
# and MANAGE (put_secret/put_acl) on the secondary at failover.
service_principal: dc5781bc-c86f-4808-a00c-930062f91f17

# POC-only seeding (used by notebooks/secrets/01_seed_secrets.py). Creates sample
# secret scopes + keys + ACLs in the PRIMARY so the export has something to protect.
# Only key NAMES and ACLs are listed here -- the VALUES are generated randomly at
# runtime and never stored in git. In production this section is ignored (your real
# scopes already exist). Remove/empty it once you point `scopes.include` at real scopes.
seed:
  scopes:
    - name: dr_app_prod
      keys: [db_password, api_token, service_url]
      acls:
        - {principal: account users, permission: READ}
    - name: dr_app_analytics
      keys: [warehouse_token, s3_access_key]
      acls: []
